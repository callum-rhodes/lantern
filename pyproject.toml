[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern"
version = "0.1.0"
description = "A small, self-hosted personal finance tracker for your home network."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Callum Rhodes" }]
# The runtime dependencies live in requirements.txt (also used by the Dockerfile),
# so there is only one list to keep up to date.
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lantern = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["db*", "web_app*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
