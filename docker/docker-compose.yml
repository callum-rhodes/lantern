services:
  lantern-finance-tracker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lantern
    restart: unless-stopped
    ports:
      # Users log in with passwords, but the app serves plain HTTP, so passwords cross
      # the network unencrypted. Only use it on a network you trust. On a server, prefer
      # binding to localhost and putting a reverse proxy with HTTPS in front,
      # e.g. "127.0.0.1:8080:8080".
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/London}
      # FINANCE_STORAGE_SECRET: change-me   # optional; otherwise generated and kept in the database
      # Forgot a password? Run: docker compose exec lantern-finance-tracker python main.py --reset-password NAME
    volumes:
      - finance-data:/data

volumes:
  finance-data: